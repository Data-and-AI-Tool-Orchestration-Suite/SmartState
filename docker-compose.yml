name: smartstate

services:
  php:
    build: ./website/SmartState-backend/php
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9000"]
      interval: 30s
      timeout: 5s
      retries: 3
      # composer install runs in the entrypoint before php-fpm binds port 9000;
      # allow time for a cold install on a fresh checkout
      start_period: 120s
    volumes:
      - ./website/SmartState-frontend/:/var/www/html/
      - ./website/SmartState-frontend/css/:/var/www/html/${ROOT_URL:-}/css/
      - ./website/SmartState-frontend/img/:/var/www/html/${ROOT_URL:-}/img/
      - ./website/SmartState-frontend/js/:/var/www/html/${ROOT_URL:-}/js/

  engine:
    build: ./java
    networks:
      - backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HLQ_web_port: "9000"
      HLQ_db_host: postgres
      HLQ_db_port: "5432"
      HLQ_db_name: ${POSTGRES_DB}
      HLQ_db_user: smartstate_engine
      HLQ_db_password: ${ENGINE_DB_PASSWORD}
      HLQ_disable_messaging: ${DISABLE_MESSAGING:-true}
      HLQ_twilio_account_sid: ${TWILIO_ACCOUNT_SID:-}
      HLQ_twilio_auth_token: ${TWILIO_AUTH_TOKEN:-}
      HLQ_twilio_from_number: ${TWILIO_FROM_NUMBER:-}
      HLQ_twilio_validate_webhook: ${TWILIO_VALIDATE_WEBHOOK:-true}
      HLQ_public_base_url: ${PUBLIC_BASE_URL:-http://localhost:8080}
      HLQ_survey_url: ${SURVEY_URL:-http://localhost:8080/survey/take-survey/}
      HLQ_llm_api_url: ${LLM_API_URL:-}
      HLQ_llm_api_key: ${LLM_API_KEY:-}
      HLQ_llm_model: ${LLM_MODEL:-}
      HLQ_checkdelay: ${CHECKDELAY:-5000}
      HLQ_checktimer: ${CHECKTIMER:-30000}

  apache:
    build: ./website/SmartState-backend/apache
    depends_on:
      php:
        condition: service_healthy
      engine:
        condition: service_healthy
    networks:
      - frontend
      - backend
    ports:
      - "${APACHE_PORT:-8080}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - ./website/SmartState-frontend/:/var/www/html/
      - ./website/SmartState-frontend/css/:/var/www/html/${ROOT_URL:-}/css/
      - ./website/SmartState-frontend/img/:/var/www/html/${ROOT_URL:-}/img/
      - ./website/SmartState-frontend/js/:/var/www/html/${ROOT_URL:-}/js/

  postgres:
    build: ./website/SmartState-backend/postgres
    environment:
      TZ: "GMT"
      PGTZ: "GMT"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ADMIN_EPPN: ${ADMIN_EPPN}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      ENGINE_DB_PASSWORD: ${ENGINE_DB_PASSWORD}
    networks:
      - backend
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes:
      - sql-data:/var/lib/postgresql

networks:
  frontend:
  backend:

volumes:
  sql-data:
    name: smartstate-sql-data
