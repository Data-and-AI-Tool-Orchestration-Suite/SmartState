name: Prepare security dependency updates

on:
  push:
    branches: [feature/security-remediation]

permissions:
  contents: read

jobs:
  php-lock:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website/SmartState-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo, pdo_pgsql, curl, zip
      - run: composer update guzzlehttp/guzzle symfony/filesystem --with-dependencies --no-install --no-interaction --no-progress
      - run: composer validate --strict
      - run: composer audit --locked --format=json > composer-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: updated-composer-lock
          path: |
            website/SmartState-frontend/composer.lock
            website/SmartState-frontend/composer-audit.json

  java-dependencies:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - run: ./mvnw -B -ntp verify dependency:tree -DoutputFile=target/dependency-tree.txt
      - uses: actions/upload-artifact@v4
        with:
          name: java-dependency-tree
          path: java/target/dependency-tree.txt
